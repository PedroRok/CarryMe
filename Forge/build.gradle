plugins {
    id 'loader'
    id 'net.minecraftforge.gradle' version '[7.0.31,8.0)'
}

minecraft {

    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = files(at)
    }

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id

            environment 'MOD_CLASSES', (sourceSets.main.output.classesDirs.files + [sourceSets.main.output.resourcesDir])
                    .collect { "${mod_id}%%${it.absolutePath}" }
                    .join(File.pathSeparator)
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all',
                    '--output', layout.projectDirectory.dir('src/generated/resources'),
                    '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
    runtimeOnly "net.minecraftforge:bootstrap-dev:${bootstrap_version}"

    // Carry On dependency - no longer needs deobfuscation on unobfuscated Minecraft
    implementation "tschipp.carryon:carryon-forge-${minecraft_version}:${carry_on_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
